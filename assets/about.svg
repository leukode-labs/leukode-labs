<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FE0FF"/><stop offset=".5" stop-color="#1AA7FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <linearGradient id="brandv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FE0FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#1AA7FF" stop-opacity=".55"/><stop offset="1" stop-color="#1AA7FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#4F7BFF" stop-opacity=".45"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="rgba(148,180,255,.10)" stroke-width="1"/></pattern>
  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="gridMask"><rect width="1200" height="400" fill="url(#fadeY)"/></mask>
  <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
</defs>
<style>
  text{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
  .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
  .t{fill:#EAF2FF} .m{fill:#8E9BB3}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,24px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,-20px)}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ga{animation:drift 14s ease-in-out infinite}
  .gb{animation:drift2 18s ease-in-out infinite}
  .r{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="400" fill="#070B14"/>
  <circle class="ga" cx="216" cy="40" r="456" fill="url(#glowA)" opacity=".55"/>
  <circle class="gb" cx="1080" cy="380" r="408.00000000000006" fill="url(#glowB)" opacity=".5"/>
  <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <g class="r" style="animation-delay:0.1s">
  <circle cx="69" cy="79" r="4.5" fill="url(#brand)" style="animation:pulse 2.4s ease-in-out infinite"/>
  <text x="84" y="84" font-size="14" font-weight="600" letter-spacing="3" fill="#1AA7FF" class="mono">01  —  WHAT WE DO</text></g>
  <text x="64" y="160" font-size="46" font-weight="800" letter-spacing="-1.5" class="t r" style="animation-delay:.25s">No fluff. <tspan class="serif" font-weight="400" fill="url(#brand)">Just execution.</tspan></text>
  <g class="r" style="animation-delay:.45s"><text x="64" y="222" font-size="20" class="m">We design, build and ship production software — AI systems,</text><text x="64" y="254" font-size="20" class="m">web and mobile platforms, and automation tools for businesses</text><text x="64" y="286" font-size="20" class="m">that need them to actually work. No hype, no buzzwords: if it</text><text x="64" y="318" font-size="20" class="m">doesn’t create value, we don’t build it.</text></g>
  <g class="r" style="animation-delay:0.6s">
    <rect x="790" y="92" width="346" height="74" rx="18" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
    <rect x="790" y="92" width="4" height="74" rx="2" fill="url(#brandv)"/>
    <text x="818" y="136" font-size="22" font-weight="700" class="t">Entrepreneurs <tspan class="serif" font-weight="400" fill="#8E9BB3">who ship</tspan></text>
  </g><g class="r" style="animation-delay:0.75s">
    <rect x="790" y="184" width="346" height="74" rx="18" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
    <rect x="790" y="184" width="4" height="74" rx="2" fill="url(#brandv)"/>
    <text x="818" y="228" font-size="22" font-weight="700" class="t">Builders <tspan class="serif" font-weight="400" fill="#8E9BB3">end to end</tspan></text>
  </g><g class="r" style="animation-delay:0.8999999999999999s">
    <rect x="790" y="276" width="346" height="74" rx="18" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
    <rect x="790" y="276" width="4" height="74" rx="2" fill="url(#brandv)"/>
    <text x="818" y="320" font-size="22" font-weight="700" class="t">Problem-solvers <tspan class="serif" font-weight="400" fill="#8E9BB3">first</tspan></text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="27.5" stroke="rgba(148,180,255,.16)"/>
</svg>