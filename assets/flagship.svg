<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FE0FF"/><stop offset=".5" stop-color="#1AA7FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <linearGradient id="brandv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FE0FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#1AA7FF" stop-opacity=".55"/><stop offset="1" stop-color="#1AA7FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#4F7BFF" stop-opacity=".45"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="rgba(148,180,255,.10)" stroke-width="1"/></pattern>
  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="gridMask"><rect width="1200" height="600" fill="url(#fadeY)"/></mask>
  <clipPath id="card"><rect width="1200" height="600" rx="28"/></clipPath>
</defs>
<style>
  text{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
  .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
  .t{fill:#EAF2FF} .m{fill:#8E9BB3}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,24px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,-20px)}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ga{animation:drift 14s ease-in-out infinite}
  .gb{animation:drift2 18s ease-in-out infinite}
  .r{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes row{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
    @keyframes stamp{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="600" fill="#070B14"/>
  <circle class="ga" cx="216" cy="60" r="456" fill="url(#glowA)" opacity=".55"/>
  <circle class="gb" cx="1080" cy="570" r="408.00000000000006" fill="url(#glowB)" opacity=".5"/>
  <rect width="1200" height="600" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <g class="r" style="animation-delay:0.1s">
  <circle cx="69" cy="79" r="4.5" fill="url(#brand)" style="animation:pulse 2.4s ease-in-out infinite"/>
  <text x="84" y="84" font-size="14" font-weight="600" letter-spacing="3" fill="#1AA7FF" class="mono">02  —  FLAGSHIP PRODUCT</text></g>
  <text x="64" y="160" font-size="50" font-weight="800" letter-spacing="-1.6" class="t r" style="animation-delay:.25s">Maison Stella</text>
  <text x="66" y="206" font-size="34" class="serif r" fill="url(#brand)" style="animation-delay:.35s">Gestion</text>
  <g class="r" style="animation-delay:.5s">
    <text x="64" y="262" font-size="18" class="m">Business management for a services company in Bukavu, DR Congo —</text>
    <text x="64" y="290" font-size="18" class="m">a paper workflow turned into professional, offline-first software.</text>
  </g>
  <g class="r" style="animation-delay:0.65s">
    <circle cx="76" cy="340" r="11" fill="rgba(26,167,255,.14)"/>
    <path d="M70 340 l4 4 l8 -8" stroke="#2FE0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="346" font-size="17" class="t">Proforma invoices, invoices &amp; receipts</text></g><g class="r" style="animation-delay:0.77s">
    <circle cx="76" cy="380" r="11" fill="rgba(26,167,255,.14)"/>
    <path d="M70 380 l4 4 l8 -8" stroke="#2FE0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="386" font-size="17" class="t">Payment tracking and balance follow-up</text></g><g class="r" style="animation-delay:0.89s">
    <circle cx="76" cy="420" r="11" fill="rgba(26,167,255,.14)"/>
    <path d="M70 420 l4 4 l8 -8" stroke="#2FE0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="426" font-size="17" class="t">Offline-first on Windows</text></g><g class="r" style="animation-delay:1.01s">
    <circle cx="76" cy="460" r="11" fill="rgba(26,167,255,.14)"/>
    <path d="M70 460 l4 4 l8 -8" stroke="#2FE0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="466" font-size="17" class="t">Automatic cloud backup</text></g><g class="r" style="animation-delay:1.13s">
    <circle cx="76" cy="500" r="11" fill="rgba(26,167,255,.14)"/>
    <path d="M70 500 l4 4 l8 -8" stroke="#2FE0FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="506" font-size="17" class="t">Self-updating installers</text></g>

  <!-- app window -->
  <g style="animation:fade 1s .5s both">
    <rect x="658" y="122" width="500" height="420" rx="18" fill="#1AA7FF" opacity=".10"/>
    <rect x="640" y="96" width="500" height="420" rx="18" fill="#0E1626" stroke="rgba(148,180,255,.2)"/>
    <rect x="640" y="96" width="500" height="44" rx="18" fill="#121C30"/><rect x="640" y="122" width="500" height="18" fill="#121C30"/>
    <circle cx="664" cy="118" r="6" fill="#FF5F57"/><circle cx="684" cy="118" r="6" fill="#FEBC2E"/><circle cx="704" cy="118" r="6" fill="#28C840"/>
    <text x="890" y="123" font-size="13" text-anchor="middle" class="m">Maison Stella — Gestion</text>
    <!-- sidebar -->
    <rect x="640" y="140" width="118" height="376" fill="#0C1322"/>
    <rect x="652" y="158" width="94" height="30" rx="8" fill="transparent"/><text x="664" y="178" font-size="13" fill="#8E9BB3">Tableau</text><rect x="652" y="198" width="94" height="30" rx="8" fill="rgba(26,167,255,.16)"/><text x="664" y="218" font-size="13" fill="#2FE0FF">Factures</text><rect x="652" y="238" width="94" height="30" rx="8" fill="transparent"/><text x="664" y="258" font-size="13" fill="#8E9BB3">Clients</text><rect x="652" y="278" width="94" height="30" rx="8" fill="transparent"/><text x="664" y="298" font-size="13" fill="#8E9BB3">Paiements</text><rect x="652" y="318" width="94" height="30" rx="8" fill="transparent"/><text x="664" y="338" font-size="13" fill="#8E9BB3">Rapports</text>
    <!-- totals -->
    <text x="780" y="178" font-size="12" letter-spacing="1.5" class="m mono">ENCAISSÉ CE MOIS</text>
    <text x="780" y="214" font-size="30" font-weight="800" class="t">5 585 000 <tspan font-size="14" font-weight="600" fill="#8E9BB3">FC</tspan></text>
    <rect x="780" y="230" width="330" height="6" rx="3" fill="rgba(148,180,255,.12)"/>
    <rect x="780" y="230" width="236" height="6" rx="3" fill="url(#brand)" style="transform-origin:780px 0;animation:bar 1.6s 1.2s cubic-bezier(.2,.8,.2,1) both"/>
    <!-- table -->
    <g style="animation:row .6s 1.4s cubic-bezier(.2,.8,.2,1) both">
        <rect x="772" y="245" width="352" height="32" rx="9" fill="rgba(255,255,255,.03)"/>
        <text x="786" y="268" font-size="12.5" class="mono t">PF-0142</text>
        <text x="866" y="268" font-size="12.5" class="m">Proforma</text>
        <text x="1020" y="268" font-size="12.5" text-anchor="end" class="t">1 240 000</text>
        <rect x="1036" y="253" width="78" height="20" rx="10" fill="#1AA7FF" fill-opacity=".14"/>
        <text x="1075" y="267" font-size="11" text-anchor="middle" fill="#1AA7FF" font-weight="600">Envoyée</text></g><g style="animation:row .6s 1.68s cubic-bezier(.2,.8,.2,1) both">
        <rect x="772" y="285" width="352" height="32" rx="9" fill="rgba(255,255,255,.03)"/>
        <text x="786" y="308" font-size="12.5" class="mono t">FA-0381</text>
        <text x="866" y="308" font-size="12.5" class="m">Facture</text>
        <text x="1020" y="308" font-size="12.5" text-anchor="end" class="t">860 000</text>
        <rect x="1036" y="293" width="78" height="20" rx="10" fill="#28C840" fill-opacity=".14"/>
        <text x="1075" y="307" font-size="11" text-anchor="middle" fill="#28C840" font-weight="600">Payée</text></g><g style="animation:row .6s 1.96s cubic-bezier(.2,.8,.2,1) both">
        <rect x="772" y="325" width="352" height="32" rx="9" fill="rgba(255,255,255,.03)"/>
        <text x="786" y="348" font-size="12.5" class="mono t">RC-0207</text>
        <text x="866" y="348" font-size="12.5" class="m">Reçu</text>
        <text x="1020" y="348" font-size="12.5" text-anchor="end" class="t">860 000</text>
        <rect x="1036" y="333" width="78" height="20" rx="10" fill="#28C840" fill-opacity=".14"/>
        <text x="1075" y="347" font-size="11" text-anchor="middle" fill="#28C840" font-weight="600">Payée</text></g><g style="animation:row .6s 2.24s cubic-bezier(.2,.8,.2,1) both">
        <rect x="772" y="365" width="352" height="32" rx="9" fill="rgba(255,255,255,.03)"/>
        <text x="786" y="388" font-size="12.5" class="mono t">FA-0382</text>
        <text x="866" y="388" font-size="12.5" class="m">Facture</text>
        <text x="1020" y="388" font-size="12.5" text-anchor="end" class="t">2 150 000</text>
        <rect x="1036" y="373" width="78" height="20" rx="10" fill="#FEBC2E" fill-opacity=".14"/>
        <text x="1075" y="387" font-size="11" text-anchor="middle" fill="#FEBC2E" font-weight="600">En attente</text></g><g style="animation:row .6s 2.52s cubic-bezier(.2,.8,.2,1) both">
        <rect x="772" y="405" width="352" height="32" rx="9" fill="rgba(255,255,255,.03)"/>
        <text x="786" y="428" font-size="12.5" class="mono t">FA-0383</text>
        <text x="866" y="428" font-size="12.5" class="m">Facture</text>
        <text x="1020" y="428" font-size="12.5" text-anchor="end" class="t">475 000</text>
        <rect x="1036" y="413" width="78" height="20" rx="10" fill="#28C840" fill-opacity=".14"/>
        <text x="1075" y="427" font-size="11" text-anchor="middle" fill="#28C840" font-weight="600">Payée</text></g>
    <!-- stamp -->
    <g style="transform-origin:1044px 480px;animation:stamp .5s 3.2s cubic-bezier(.3,1.6,.5,1) both">
      <rect x="986" y="462" width="116" height="36" rx="8" stroke="#28C840" stroke-width="2.5" transform="rotate(-6 1044 480)"/>
      <text x="1044" y="487" font-size="17" font-weight="800" letter-spacing="3.5" text-anchor="middle" fill="#28C840" transform="rotate(-6 1044 480)">PAYÉE</text>
    </g>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="599" rx="27.5" stroke="rgba(148,180,255,.16)"/>
</svg>