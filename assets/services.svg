<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FE0FF"/><stop offset=".5" stop-color="#1AA7FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <linearGradient id="brandv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FE0FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#1AA7FF" stop-opacity=".55"/><stop offset="1" stop-color="#1AA7FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#4F7BFF" stop-opacity=".45"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="rgba(148,180,255,.10)" stroke-width="1"/></pattern>
  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="gridMask"><rect width="1200" height="560" fill="url(#fadeY)"/></mask>
  <clipPath id="card"><rect width="1200" height="560" rx="28"/></clipPath>
</defs>
<style>
  text{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
  .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
  .t{fill:#EAF2FF} .m{fill:#8E9BB3}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,24px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,-20px)}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ga{animation:drift 14s ease-in-out infinite}
  .gb{animation:drift2 18s ease-in-out infinite}
  .r{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes glow{0%,100%{opacity:0}12%,30%{opacity:1}45%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="560" fill="#070B14"/>
  <circle class="ga" cx="216" cy="56" r="456" fill="url(#glowA)" opacity=".55"/>
  <circle class="gb" cx="1080" cy="532" r="408.00000000000006" fill="url(#glowB)" opacity=".5"/>
  <rect width="1200" height="560" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <g class="r" style="animation-delay:0.1s">
  <circle cx="69" cy="79" r="4.5" fill="url(#brand)" style="animation:pulse 2.4s ease-in-out infinite"/>
  <text x="84" y="84" font-size="14" font-weight="600" letter-spacing="3" fill="#1AA7FF" class="mono">03  —  WHAT WE BUILD</text></g>
  <text x="64" y="150" font-size="46" font-weight="800" letter-spacing="-1.5" class="t r" style="animation-delay:.25s">If it needs brains, speed and precision — <tspan class="serif" font-weight="400" fill="url(#brand)">we build it.</tspan></text>
  <g class="r" style="animation-delay:0.45s">
      <rect x="64" y="190" width="254" height="300" rx="22" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
      <rect x="64" y="190" width="254" height="300" rx="22" stroke="url(#brandv)" stroke-width="1.5" style="opacity:0;animation:glow 6s 0s ease-in-out infinite"/>
      <rect x="92" y="220" width="72" height="72" rx="18" fill="rgba(26,167,255,.10)"/>
      <path d="M14 30h44M14 20h44v32H14zM26 52v8M46 52v8M20 60h32" transform="translate(92 220)" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="340" font-size="21" font-weight="700" class="t">Enterprise digital</text>
      <text x="92" y="368" font-size="21" font-weight="700" class="t">products</text>
      <text x="92" y="406" font-size="15.5" class="m">AI-powered web applications,</text><text x="92" y="431" font-size="15.5" class="m">admin systems and business</text><text x="92" y="456" font-size="15.5" class="m">platforms.</text>
      <text x="290" y="246" font-size="13" letter-spacing="2" text-anchor="end" class="mono" fill="#1AA7FF">01</text>
    </g><g class="r" style="animation-delay:0.6s">
      <rect x="338" y="190" width="254" height="300" rx="22" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
      <rect x="338" y="190" width="254" height="300" rx="22" stroke="url(#brandv)" stroke-width="1.5" style="opacity:0;animation:glow 6s 1.5s ease-in-out infinite"/>
      <rect x="366" y="220" width="72" height="72" rx="18" fill="rgba(26,167,255,.10)"/>
      <path d="M16 54V38M30 54V26M44 54V32M58 54V18M12 58h50" transform="translate(366 220)" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="366" y="340" font-size="21" font-weight="700" class="t">Intelligence systems</text>
      
      <text x="366" y="380" font-size="15.5" class="m">Smart dashboards, real-time</text><text x="366" y="405" font-size="15.5" class="m">data processing, embedded</text><text x="366" y="430" font-size="15.5" class="m">decision support.</text>
      <text x="564" y="246" font-size="13" letter-spacing="2" text-anchor="end" class="mono" fill="#1AA7FF">02</text>
    </g><g class="r" style="animation-delay:0.75s">
      <rect x="612" y="190" width="254" height="300" rx="22" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
      <rect x="612" y="190" width="254" height="300" rx="22" stroke="url(#brandv)" stroke-width="1.5" style="opacity:0;animation:glow 6s 3s ease-in-out infinite"/>
      <rect x="640" y="220" width="72" height="72" rx="18" fill="rgba(26,167,255,.10)"/>
      <path d="M24 14h24v46H24zM33 54h6M12 26v26M60 26v26" transform="translate(640 220)" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="640" y="340" font-size="21" font-weight="700" class="t">Mobile &amp;</text>
      <text x="640" y="368" font-size="21" font-weight="700" class="t">desktop apps</text>
      <text x="640" y="406" font-size="15.5" class="m">Cross-platform apps and</text><text x="640" y="431" font-size="15.5" class="m">offline-first desktop software</text><text x="640" y="456" font-size="15.5" class="m">with automatic updates.</text>
      <text x="838" y="246" font-size="13" letter-spacing="2" text-anchor="end" class="mono" fill="#1AA7FF">03</text>
    </g><g class="r" style="animation-delay:0.8999999999999999s">
      <rect x="886" y="190" width="254" height="300" rx="22" fill="rgba(255,255,255,.025)" stroke="rgba(148,180,255,.14)"/>
      <rect x="886" y="190" width="254" height="300" rx="22" stroke="url(#brandv)" stroke-width="1.5" style="opacity:0;animation:glow 6s 4.5s ease-in-out infinite"/>
      <rect x="914" y="220" width="72" height="72" rx="18" fill="rgba(26,167,255,.10)"/>
      <path d="M18 24h14l8 12-8 12H18l8-12zM40 24h14l8 12-8 12H40l8-12z" transform="translate(914 220)" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="914" y="340" font-size="21" font-weight="700" class="t">Automation &amp; APIs</text>
      
      <text x="914" y="380" font-size="15.5" class="m">Workflow automation,</text><text x="914" y="405" font-size="15.5" class="m">integrations and scalable,</text><text x="914" y="430" font-size="15.5" class="m">production-ready APIs.</text>
      <text x="1112" y="246" font-size="13" letter-spacing="2" text-anchor="end" class="mono" fill="#1AA7FF">04</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="559" rx="27.5" stroke="rgba(148,180,255,.16)"/>
</svg>