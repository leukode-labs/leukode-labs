<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
<defs><linearGradient id="btnShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3.2s" repeatCount="indefinite"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FE0FF"/><stop offset=".5" stop-color="#1AA7FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <linearGradient id="brandv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FE0FF"/><stop offset="1" stop-color="#4F7BFF"/></linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#1AA7FF" stop-opacity=".55"/><stop offset="1" stop-color="#1AA7FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#4F7BFF" stop-opacity=".45"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="rgba(148,180,255,.10)" stroke-width="1"/></pattern>
  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="gridMask"><rect width="1200" height="420" fill="url(#fadeY)"/></mask>
  <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
</defs>
<style>
  text{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic}
  .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
  .t{fill:#EAF2FF} .m{fill:#8E9BB3}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,24px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,-20px)}}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ga{animation:drift 14s ease-in-out infinite}
  .gb{animation:drift2 18s ease-in-out infinite}
  .r{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="420" fill="#070B14"/>
  <circle class="ga" cx="216" cy="42" r="456" fill="url(#glowA)" opacity=".55"/>
  <circle class="gb" cx="1080" cy="399" r="408.00000000000006" fill="url(#glowB)" opacity=".5"/>
  <rect width="1200" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <circle cx="600" cy="210" r="170" stroke="rgba(148,180,255,.10)" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="50s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="210" r="250" stroke="rgba(148,180,255,.06)"/>
  <g><animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="14s" repeatCount="indefinite"/><circle cx="600" cy="40" r="5" fill="#2FE0FF"/></g>
  <g class="r" style="animation-delay:0.1s">
  <circle cx="505" cy="79" r="4.5" fill="url(#brand)" style="animation:pulse 2.4s ease-in-out infinite"/>
  <text x="520" y="84" font-size="14" font-weight="600" letter-spacing="3" fill="#1AA7FF" class="mono">07  —  CONTACT</text></g>
  <text x="600" y="170" font-size="54" font-weight="800" letter-spacing="-1.8" text-anchor="middle" class="t r" style="animation-delay:.25s">Got something that needs brains?</text>
  <text x="600" y="236" font-size="54" text-anchor="middle" class="serif r" fill="url(#brand)" style="animation-delay:.4s">Let’s build it.</text>
  <text x="600" y="286" font-size="18" text-anchor="middle" class="m r" style="animation-delay:.55s">Open for collaborations, partnerships and custom builds — projects, proposals and enterprise work welcome.</text>
  <g class="r" style="animation-delay:.7s">
    <rect x="450" y="318" width="300" height="56" rx="28" fill="url(#brand)"/>
    <rect x="450" y="318" width="300" height="56" rx="28" fill="url(#btnShine)"/>
    <text x="600" y="352" font-size="17" font-weight="700" text-anchor="middle" fill="#04111F">Start a project  →</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="419" rx="27.5" stroke="rgba(148,180,255,.16)"/>
</svg>