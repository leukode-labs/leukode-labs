<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00A8FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
  <linearGradient id="brandd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A8FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
  <linearGradient id="cardG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243B53"/><stop offset="1" stop-color="#0A1628"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#00A8FF" stop-opacity=".35"/><stop offset="1" stop-color="#00A8FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="rgba(0,168,255,.07)"/></pattern>
  <clipPath id="frame"><rect width="1200" height="560" rx="8"/></clipPath>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-1.2 0;1.2 0" dur="3.4s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  text{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .w{fill:#FFFFFF} .g{fill:#D1D5DB} .m{fill:#9CA3AF} .b{fill:#00A8FF} .n{fill:#050B14} .s{fill:#243B53}
  .cap{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .f{animation:fade 1s ease both}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="560" fill="#050B14"/>

  <circle cx="300" cy="280" r="460" fill="url(#glow)" opacity=".55"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity=".45"/>
  <g class="r" style="animation-delay:0s"><rect x="64" y="78" width="249.20000000000002" height="28" rx="3" fill="rgba(0,168,255,.10)" stroke="rgba(0,168,255,.35)"/>
  <text x="188.60000000000002" y="96.5" font-size="12.5" font-weight="500" text-anchor="middle" class="b">◷  Free 30-Minute Strategy Call</text></g>
  <g class="r" style="animation-delay:.15s">
    <text x="64" y="176" font-size="54" font-weight="700" letter-spacing="-1.4" class="w">Stop Losing</text>
    <text x="64" y="236" font-size="54" font-weight="700" letter-spacing="-1.4" class="w">Money.</text>
    <text x="64" y="296" font-size="54" font-weight="700" letter-spacing="-1.4" fill="url(#brand)">Start Scaling.</text>
  </g>
  <g class="r" style="animation-delay:.3s">
    <text x="64" y="346" font-size="17" class="m">Get a custom roadmap to automate your operations and 10x your</text>
    <text x="64" y="372" font-size="17" class="m">growth. No fluff, no sales pitch — just actionable strategies.</text>
  </g>
  <g class="r" style="animation-delay:0.45s"><circle cx="74" cy="414" r="9" stroke="#00A8FF" stroke-width="1.6"/><path d="M70 414 l3 3 l5 -6" stroke="#00A8FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="419" font-size="15" class="g">Free technical audit of your current systems</text></g><g class="r" style="animation-delay:0.5700000000000001s"><circle cx="74" cy="448" r="9" stroke="#00A8FF" stroke-width="1.6"/><path d="M70 448 l3 3 l5 -6" stroke="#00A8FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="453" font-size="15" class="g">Custom automation strategy worth $2,500</text></g><g class="r" style="animation-delay:0.69s"><circle cx="74" cy="482" r="9" stroke="#00A8FF" stroke-width="1.6"/><path d="M70 482 l3 3 l5 -6" stroke="#00A8FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="487" font-size="15" class="g">Zero-obligation · Cancel anytime</text></g>
  <g class="r" style="animation-delay:.4s">
    <rect x="720" y="120" width="416" height="330" rx="4" fill="rgba(10,22,40,.9)" stroke="rgba(255,255,255,.16)"/>
    <text x="752" y="176" font-size="25" font-weight="700" class="w">Book Your Free Call</text>
    <text x="752" y="210" font-size="15" class="m">Meet with our technical team to discuss your</text>
    <text x="752" y="232" font-size="15" class="m">specific challenges and opportunities.</text>
    <rect x="752" y="260" width="352" height="50" rx="2" fill="#00A8FF"/><rect x="752" y="260" width="352" height="50" rx="2" fill="url(#shine)"/>
    <text x="928" y="291" font-size="16" font-weight="600" text-anchor="middle" class="n">Schedule Now  →</text>
    <line x1="752" y1="342" x2="1104" y2="342" stroke="rgba(255,255,255,.10)"/>
    <text x="800" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="url(#brand)">2+</text><text x="800" y="414" font-size="12" text-anchor="middle" class="m">Years</text><text x="928" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="url(#brand)">10+</text><text x="928" y="414" font-size="12" text-anchor="middle" class="m">Projects</text><text x="1056" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="url(#brand)">100%</text><text x="1056" y="414" font-size="12" text-anchor="middle" class="m">Satisfied</text>
  </g>
</g>
</svg>