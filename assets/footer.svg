<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" fill="none">
<defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FE0FF" stop-opacity="0"/><stop offset=".5" stop-color="#1AA7FF"/><stop offset="1" stop-color="#4F7BFF" stop-opacity="0"/></linearGradient></defs>
<style>text{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic} @keyframes run{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}} @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0" y="20" width="1200" height="2" fill="url(#brand)" style="animation:run 6s linear infinite"/>
<text x="600" y="62" font-size="15" text-anchor="middle" fill="#8E9BB3" letter-spacing="1">LEUKODE LABS  ·  <tspan class="serif" fill="#1AA7FF">Building intelligence beyond limits</tspan>  ·  Made in Rwanda</text>
