<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00A8FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
  <linearGradient id="brandd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A8FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
  <linearGradient id="cardG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243B53"/><stop offset="1" stop-color="#0A1628"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#00A8FF" stop-opacity=".35"/><stop offset="1" stop-color="#00A8FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="rgba(0,168,255,.07)"/></pattern>
  <clipPath id="frame"><rect width="1200" height="600" rx="8"/></clipPath>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="-1.2 0;1.2 0" dur="3.4s" repeatCount="indefinite"/></linearGradient><linearGradient id="cardSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A8FF" stop-opacity=".18"/><stop offset=".6" stop-color="#00A8FF" stop-opacity="0"/></linearGradient>
</defs>
<style>
  text{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
  .w{fill:#FFFFFF} .g{fill:#D1D5DB} .m{fill:#9CA3AF} .b{fill:#00A8FF} .n{fill:#050B14} .s{fill:#243B53}
  .cap{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .r{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .f{animation:fade 1s ease both}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="600" fill="#050B14"/>

  <rect width="1200" height="600" fill="url(#grid)" opacity=".5"/>
  <g class="r" style="animation-delay:.1s">
    <text x="64" y="140" font-size="42" font-weight="700" letter-spacing="-1" class="w">A process built for</text>
    <text x="64" y="192" font-size="42" font-weight="700" letter-spacing="-1" fill="url(#brand)">rapid execution</text>
  </g>
  <g class="r" style="animation-delay:.25s">
    <text x="64" y="240" font-size="17" class="m">From concept to launch, we move fast without compromising</text>
    <text x="64" y="266" font-size="17" class="m">quality. Your digital systems operational in weeks, not months.</text>
  </g>
  <g class="r" style="animation-delay:0.4s">
    <rect x="64" y="312" width="44" height="44" rx="2" fill="#00A8FF"/>
    <text x="86" y="340" font-size="15" font-weight="700" text-anchor="middle" class="n">01</text>
    <text x="128" y="330" font-size="19" font-weight="700" class="w">Discovery &amp; Strategy</text>
    <text x="128" y="354" font-size="15" class="m">We understand your goals and map the solution</text></g><g class="r" style="animation-delay:0.55s">
    <rect x="64" y="400" width="44" height="44" rx="2" fill="#00A8FF"/>
    <text x="86" y="428" font-size="15" font-weight="700" text-anchor="middle" class="n">02</text>
    <text x="128" y="418" font-size="19" font-weight="700" class="w">Design &amp; Build</text>
    <text x="128" y="442" font-size="15" class="m">Rapid development with continuous feedback</text></g><g class="r" style="animation-delay:0.7s">
    <rect x="64" y="488" width="44" height="44" rx="2" fill="#00A8FF"/>
    <text x="86" y="516" font-size="15" font-weight="700" text-anchor="middle" class="n">03</text>
    <text x="128" y="506" font-size="19" font-weight="700" class="w">Launch &amp; Optimize</text>
    <text x="128" y="530" font-size="15" class="m">Go live and refine based on real data</text></g>
  <g class="r" style="animation-delay:.3s">
    <rect x="660" y="70" width="476" height="460" rx="4" fill="#F9FAFB"/>
    <rect x="684" y="94" width="428" height="150" rx="2" fill="#0A1628"/>
    <rect x="684" y="94" width="428" height="150" rx="2" fill="url(#cardSheen)"/>
    <text x="712" y="178" font-size="62" font-weight="800" letter-spacing="-2" fill="url(#brand)">2-4</text>
    <text x="828" y="176" font-size="26" font-weight="600" class="w">weeks</text>
    <text x="712" y="214" font-size="15" class="m">From kickoff to launch</text>
    <g style="animation:fade .6s 0.9s both"><rect x="684" y="266" width="208" height="78" rx="2" fill="#fff" stroke="#E2E8F0"/>
        <rect x="702" y="282" width="22" height="22" rx="3" stroke="#00A8FF" stroke-width="1.8"/><path d="M708 293 l4 4 l7 -8" stroke="#00A8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="702" y="328" font-size="15" font-weight="600" class="s">Weekly Updates</text></g><g style="animation:fade .6s 1.05s both"><rect x="904" y="266" width="208" height="78" rx="2" fill="#fff" stroke="#E2E8F0"/>
        <rect x="922" y="282" width="22" height="22" rx="3" stroke="#00A8FF" stroke-width="1.8"/><path d="M928 293 l4 4 l7 -8" stroke="#00A8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="922" y="328" font-size="15" font-weight="600" class="s">Direct Access</text></g><g style="animation:fade .6s 1.2s both"><rect x="684" y="358" width="208" height="78" rx="2" fill="#fff" stroke="#E2E8F0"/>
        <rect x="702" y="374" width="22" height="22" rx="3" stroke="#00A8FF" stroke-width="1.8"/><path d="M708 385 l4 4 l7 -8" stroke="#00A8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="702" y="420" font-size="15" font-weight="600" class="s">Flexible Scope</text></g><g style="animation:fade .6s 1.35s both"><rect x="904" y="358" width="208" height="78" rx="2" fill="#fff" stroke="#E2E8F0"/>
        <rect x="922" y="374" width="22" height="22" rx="3" stroke="#00A8FF" stroke-width="1.8"/><path d="M928 385 l4 4 l7 -8" stroke="#00A8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="922" y="420" font-size="15" font-weight="600" class="s">Post-Launch Support</text></g>
    <rect x="684" y="462" width="428" height="46" rx="2" fill="#00A8FF"/><rect x="684" y="462" width="428" height="46" rx="2" fill="url(#shine)"/>
    <text x="898" y="491" font-size="15" font-weight="600" text-anchor="middle" class="n">Start Your Project  →</text>
  </g>
</g>
</svg>